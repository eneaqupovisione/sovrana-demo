<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOVRANA</title>
<style>
  /* ============================================================
     Palette campionata dai riflessi del video (petrolio + argento
     + nero). L'oro non esiste nel girato: e' l'accento aggiunto.
     ============================================================ */
  :root{
    --void:#040507;
    --ink:#080D0D;
    --petrol-d:#0C1517;
    --petrol:#1A2A30;
    --petrol-l:#273D46;
    --teal:#3D5258;
    --teal-lit:#8FBFC4;
    --silver-d:#5C6C6E;
    --silver:#A1ABA6;
    --silver-l:#C3CEC6;
    --silver-w:#EBF2E8;
    --gold:#C9A227;
    --gold-l:#E4D2A0;

    --serif:'Didot','Bodoni 72',Didot,'Times New Roman',serif;
    --sans:'Helvetica Neue',Inter,-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;

    --stage:330vh;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--void)}
  body{
    background:var(--void);color:var(--silver-l);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--gold);color:var(--void)}

  .mono{
    font-family:var(--mono);font-size:.6rem;letter-spacing:.34em;
    text-transform:uppercase;color:var(--silver-d);
  }
  .gold{color:var(--gold-l)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}

  /* ---------------- loader ---------------- */
  #loader{
    position:fixed;inset:0;z-index:200;background:var(--void);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;
    transition:opacity 1s ease;
  }
  #loader.done{opacity:0;pointer-events:none}
  #loader .mk{
    font-family:var(--serif);font-size:clamp(1rem,2vw,1.3rem);
    letter-spacing:.5em;color:var(--silver);padding-left:.5em;
  }
  #bar{width:min(220px,44vw);height:1px;background:#161c1e;overflow:hidden}
  #bar span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}

  /* ---------------- palco pinnato ---------------- */
  #stage{position:relative;height:var(--stage)}
  .pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
  #seq{display:block;width:100%;height:100%}

  /* grana + vignettatura: tengono insieme il girato e la UI */
  .vig{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(130% 100% at 50% 45%,transparent 30%,rgba(4,5,7,.72) 100%),
      linear-gradient(to bottom,rgba(4,5,7,.7),transparent 24%,transparent 72%,rgba(4,5,7,.9));
  }

  /* ---------------- il marchio ---------------- */
  #mark{
    position:absolute;inset:0;z-index:4;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #word{display:flex;white-space:nowrap;will-change:letter-spacing}
  #word .l{
    display:block;will-change:transform,opacity,filter;
  }
  #word .l i{
    display:block;font-style:normal;
    font-family:var(--serif);
    font-size:clamp(2.1rem,10.4vw,8.6rem);
    line-height:1;
    background:linear-gradient(102deg,
      var(--silver-d) 0%,var(--silver-w) 22%,var(--gold-l) 44%,
      var(--silver-w) 62%,var(--silver) 82%,var(--silver-d) 100%);
    background-size:280% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:beat 1.6s cubic-bezier(.4,0,.2,1) infinite, sheen 9s linear infinite;
  }
  /* battuta: respiro verticale, non un rimbalzo */
  @keyframes beat{
    0%,100%{transform:translateY(0) scaleY(1);opacity:.82}
    38%    {transform:translateY(-.035em) scaleY(1.012);opacity:1}
    70%    {transform:translateY(.008em) scaleY(.997);opacity:.9}
  }
  @keyframes sheen{
    0%  {background-position:120% 0}
    100%{background-position:-120% 0}
  }

  /* la lama d'oro che taglia il marchio mentre viene divorato */
  #blade{
    position:absolute;left:0;top:50%;z-index:5;height:1px;width:0;
    background:linear-gradient(90deg,transparent,var(--gold-l),var(--gold),transparent);
    opacity:0;pointer-events:none;
    box-shadow:0 0 18px rgba(228,210,160,.55);
  }

  .corner{position:absolute;z-index:6;pointer-events:none}
  .c-tl{top:clamp(18px,3.4vh,34px);left:clamp(18px,4vw,44px)}
  .c-tr{top:clamp(18px,3.4vh,34px);right:clamp(18px,4vw,44px);text-align:right}
  .c-bc{
    left:0;right:0;bottom:clamp(18px,3.4vh,34px);
    display:flex;align-items:center;justify-content:center;gap:.9rem;
  }
  .c-bc i{display:block;width:1px;height:30px;background:linear-gradient(var(--silver-d),transparent)}

  #closing{
    position:absolute;left:0;right:0;bottom:22vh;z-index:7;
    text-align:center;opacity:0;pointer-events:none;
    font-family:var(--mono);font-size:.62rem;letter-spacing:.42em;
    text-transform:uppercase;color:var(--gold-l);
  }

  /* ---------------- sezioni ---------------- */
  section.blk{padding:clamp(6rem,16vh,12rem) clamp(1.4rem,6vw,5rem)}
  .inner{max-width:1180px;margin:0 auto}
  .shead{display:flex;align-items:baseline;justify-content:space-between;gap:2rem;margin-bottom:3.4rem}
  h2{
    font-family:var(--serif);font-weight:400;
    font-size:clamp(1.7rem,4.4vw,3.2rem);line-height:1.06;color:var(--silver-w);
  }
  h2 em{font-style:italic;color:var(--silver-d)}

  .rv{opacity:0;transform:translateY(26px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}

  /* archivio */
  .arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(.7rem,1.6vw,1.3rem)}
  .cell{
    position:relative;aspect-ratio:16/10;overflow:hidden;
    border:1px solid rgba(161,171,166,.14);
    background:var(--ink);
    transition:border-color .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .cell img{width:100%;height:100%;object-fit:cover;display:block;
    filter:contrast(1.06) saturate(.92);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .cell figcaption{
    position:absolute;left:.7rem;bottom:.6rem;z-index:2;
    font-family:var(--mono);font-size:.54rem;letter-spacing:.26em;
    text-transform:uppercase;color:var(--silver);
    text-shadow:0 1px 8px rgba(0,0,0,.9);
  }
  .cell::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(201,162,39,0);transition:box-shadow .7s ease;
  }
  .cell:hover{border-color:rgba(201,162,39,.5);transform:translateY(-3px)}
  .cell:hover img{transform:scale(1.05)}
  .cell:hover::after{box-shadow:inset 0 0 34px rgba(201,162,39,.16)}

  /* sigillo */
  #seal{position:relative;padding:clamp(6rem,18vh,13rem) clamp(1.4rem,6vw,5rem)}
  .sealwrap{max-width:1180px;margin:0 auto;display:grid;gap:clamp(2.5rem,6vw,5rem);
    grid-template-columns:minmax(0,1fr);align-items:center;justify-items:center;text-align:center}
  #emblem{width:min(430px,74vw);height:auto;display:block;overflow:visible}
  #emblem [data-draw]{
    fill:none;stroke:var(--gold);stroke-width:.7;
    stroke-linecap:round;vector-effect:non-scaling-stroke;
  }
  #emblem .fine{stroke:var(--silver-d);stroke-width:.5;opacity:.55}
  .creed{
    font-family:var(--serif);font-size:clamp(1.15rem,2.9vw,2.05rem);
    line-height:1.42;color:var(--silver-l);max-width:26ch;
  }
  .creed b{font-weight:400;font-style:italic;color:var(--gold-l)}

  footer{padding:clamp(3rem,8vh,6rem) clamp(1.4rem,6vw,5rem) 5rem;text-align:center}
  footer .rule{margin:0 auto 2rem;max-width:340px}

  @media (max-width:720px){
    :root{--stage:280vh}
    .shead{flex-direction:column;align-items:flex-start;gap:.9rem}
  }
  @media (prefers-reduced-motion:reduce){
    #word .l i{animation:none;opacity:1}
    .rv{transition-duration:.01ms}
    .c-bc i{display:none}
  }
</style>
</head>
<body>

<div id="loader">
  <div class="mk">SOVRANA</div>
  <div id="bar"><span></span></div>
  <div class="mono" id="pct">0%</div>
</div>

<!-- ============ IL PALCO: marchio ritmato, poi divorato ============ -->
<section id="stage">
  <div class="pin">
    <canvas id="seq"></canvas>
    <div class="vig"></div>

    <div id="mark"><div id="word" aria-label="SOVRANA"></div></div>
    <div id="blade"></div>

    <p class="corner c-tl mono">Atto <span class="gold">I</span> — <span id="actName"></span></p>
    <p class="corner c-tr mono">34 quadri<br>0,84 — 2,16 s</p>
    <div class="corner c-bc"><span class="mono">Scorri</span><i></i></div>

    <p id="closing">Ogni cosa che tocca diventa sua</p>
  </div>
</section>

<!-- ============ ARCHIVIO ============ -->
<section class="blk">
  <div class="inner">
    <div class="shead rv">
      <h2>Archivio<br><em>dei quadri</em></h2>
      <p class="mono">Atto II — l'evidenza</p>
    </div>
    <div class="arch" id="arch"></div>
  </div>
</section>

<!-- ============ SIGILLO ============ -->
<section id="seal">
  <div class="sealwrap">
    <svg id="emblem" viewBox="0 0 300 300" aria-hidden="true">
      <circle data-draw cx="150" cy="150" r="122"/>
      <circle data-draw class="fine" cx="150" cy="150" r="103"/>
      <circle data-draw cx="150" cy="150" r="61"/>
      <rect   data-draw x="92" y="92" width="116" height="116" transform="rotate(45 150 150)"/>
      <path   data-draw d="M150 28 L150 272"/>
      <path   data-draw d="M28 150 L272 150"/>
      <path   data-draw class="fine" d="M64 64 L236 236"/>
      <path   data-draw class="fine" d="M236 64 L64 236"/>
      <circle data-draw cx="150" cy="150" r="15"/>
    </svg>
    <p class="creed rv">Non chiede il trono.<br><b>Lo chiude in una mano.</b></p>
  </div>
</section>

<footer>
  <div class="rule"></div>
  <p class="mono">Sovrana — sequenza a 25 fps, nessuno zoom aggiunto</p>
</footer>

<script>
(() => {
  const WORD        = 'SOVRANA';
  const FRAME_COUNT = 34;

  /* Due assi indipendenti: il verso del gesto e il verso del marchio.

     PLAY_REVERSED — il gesto
       true  : si parte con le dita sulla lente e la mano si ritrae
       false : si parte lontano e le dita si chiudono sull'obiettivo

     MARK_VANISHES — il marchio
       true  : la scritta c'e' dall'inizio e si dissolve scrollando
       false : la scritta non c'e' e si ricompone scrollando

     Combinazione attuale: la mano si ritrae mentre il nome si dissolve e
     lascia il posto alla figura.                                          */
  const PLAY_REVERSED = true;
  const MARK_VANISHES = true;

  document.getElementById('actName').textContent =
    MARK_VANISHES ? (PLAY_REVERSED ? 'il congedo' : 'la stretta')
                  : 'la rivelazione';

  const src  = i => 'frames/f_' + String(i).padStart(4, '0') + '.jpg';
  // posizione di riproduzione (1..34) -> file su disco
  const file = n => PLAY_REVERSED ? (FRAME_COUNT - n + 1) : n;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas  = document.getElementById('seq');
  const ctx     = canvas.getContext('2d', { alpha: false });
  const stage   = document.getElementById('stage');
  const wordEl  = document.getElementById('word');
  const blade   = document.getElementById('blade');
  const closing = document.getElementById('closing');
  const corners = [...document.querySelectorAll('.corner')];
  const loader  = document.getElementById('loader');
  const barFill = document.querySelector('#bar span');
  const pct     = document.getElementById('pct');

  /* ---------- il marchio, lettera per lettera ----------
     .l  -> trasformato da JS (la divorazione)
     i   -> animato dal CSS (la battuta)  ... due livelli, cosi' le due
            animazioni non si sovrascrivono la transform a vicenda.        */
  const letters = [...WORD].map((ch, i) => {
    const span = document.createElement('span');
    span.className = 'l';
    const inner = document.createElement('i');
    inner.textContent = ch;
    inner.style.animationDelay = (i * 0.075).toFixed(3) + 's, ' + (i * -0.9).toFixed(2) + 's';
    span.appendChild(inner);
    wordEl.appendChild(span);
    return span;
  });

  /* Finestre in spazio di CONSUMO (c): la lettera e' piena a c<=start,
     sparita a c>=end. In entrambi i modi le esterne stanno agli estremi della
     scala e la centrale al fondo, cosi' il marchio si chiude in un punto --
     dissolvendosi, proprio dove resta in piedi la figura.                   */
  const mid = (letters.length - 1) / 2;
  const win = letters.map((_, i) => {
    const d = mid ? Math.abs(i - mid) / mid : 0;   // 1 = piu' esterna
    const start = MARK_VANISHES ? 0.20 + (1 - d) * 0.40   // esterne per prime
                                : 0.15 + (1 - d) * 0.45;  // centrali per prime
    return { start, end: start + (MARK_VANISHES ? 0.22 : 0.25) };
  });

  /* ---------- canvas ---------- */
  let cssW = 0, cssH = 0, lastIndex = -1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = canvas.clientWidth;
    cssH = canvas.clientHeight;
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lastIndex = -1;
    drawFrame(frameAt(currentP));
  }

  const frames = new Array(FRAME_COUNT);

  // mano che si ritrae: si scosta subito e poi la scena si distende.
  // mano che si chiude: avanza piano e poi corre verso la lente.
  const frameAt = p => Math.pow(clamp(p, 0, 1), PLAY_REVERSED ? 0.85 : 1.35);

  function drawFrame(fp) {
    const index = clamp(Math.round(fp * (FRAME_COUNT - 1)), 0, FRAME_COUNT - 1);
    const img = frames[index];
    if (!img || !img.complete || index === lastIndex) return;
    lastIndex = index;
    const scale = Math.max(cssW / img.naturalWidth, cssH / img.naturalHeight);
    const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
    ctx.fillStyle = '#040507';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.drawImage(img, (cssW - w) / 2, (cssH - h) / 2, w, h);
  }

  /* ---------- la divorazione ---------- */
  function paintMark(p) {
    // c = consumo. 0 = marchio pieno, 1 = sparito.
    // Se il marchio si ricompone, il suo tempo scorre a rovescio rispetto
    // allo scroll e le lettere ripercorrono la dissolvenza all'indietro.
    const c = MARK_VANISHES ? p : 1 - p;

    // l'interlettera si apre nel tratto in cui il marchio e' in scena
    const spread = MARK_VANISHES ? clamp(p / 0.3, 0, 1)
                                 : clamp((p - 0.5) / 0.42, 0, 1);
    wordEl.style.letterSpacing = (0.02 + spread * 0.06).toFixed(4) + 'em';

    letters.forEach((el, i) => {
      const { start, end } = win[i];
      const t = clamp((c - start) / (end - start), 0, 1);
      const e = t * t;                       // la stretta accelera
      const dir = i < mid ? 1 : (i > mid ? -1 : 0);   // tirate verso il centro
      el.style.transform =
        'translate3d(' + (dir * e * 46).toFixed(1) + 'px,' + (e * 10).toFixed(1) + 'px,0)' +
        ' scale(' + (1 - e * 0.58).toFixed(3) + ')';
      el.style.opacity = (1 - t).toFixed(3);
      el.style.filter  = t > 0.02 ? 'blur(' + (e * 7).toFixed(2) + 'px)' : 'none';
      // la battuta si spegne quando la lettera comincia a cedere
      el.firstChild.style.animationPlayState = t > 0.02 ? 'paused' : 'running';
    });

    // la lama d'oro accompagna il marchio: spazza in pieno passaggio
    const bl = clamp((p - 0.18) / 0.42, 0, 1);
    blade.style.width   = (bl * 100).toFixed(1) + '%';
    blade.style.opacity = (Math.sin(bl * Math.PI) * 0.9).toFixed(3);

    const fade = clamp(1 - p / 0.3, 0, 1);
    corners.forEach(el => { el.style.opacity = fade.toFixed(3); });

    closing.style.opacity = clamp((p - 0.86) / 0.12, 0, 1).toFixed(3);
  }

  /* ---------- scroll ---------- */
  let targetP = 0, currentP = 0, raf = null;

  function measure() {
    const travel = stage.offsetHeight - window.innerHeight;
    targetP = travel > 0
      ? clamp(-stage.getBoundingClientRect().top / travel, 0, 1)
      : 0;
  }

  function loop() {
    currentP += (targetP - currentP) * (reduced ? 1 : 0.18);
    if (Math.abs(targetP - currentP) < 0.0003) currentP = targetP;
    drawFrame(frameAt(currentP));
    paintMark(currentP);
    raf = currentP === targetP ? null : requestAnimationFrame(loop);
  }

  function settle() {
    measure();
    currentP = targetP;
    drawFrame(frameAt(currentP));
    paintMark(currentP);
  }

  /* ---------- archivio ---------- */
  const PICKS = [1, 8, 15, 21, 27, 34];
  const arch = document.getElementById('arch');
  PICKS.forEach((n, k) => {
    const fig = document.createElement('figure');
    fig.className = 'cell rv';
    fig.style.transitionDelay = (k * 0.09).toFixed(2) + 's';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = src(file(n));            // segue il verso di riproduzione
    img.alt = 'Quadro ' + n;
    const cap = document.createElement('figcaption');
    cap.textContent = String(n).padStart(2, '0') + ' / 34';
    fig.append(img, cap);
    arch.appendChild(fig);
  });

  /* ---------- rivelazioni ---------- */
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.18 });
  document.querySelectorAll('.rv').forEach(el => io.observe(el));

  /* ---------- il sigillo si disegna ---------- */
  const sealSec = document.getElementById('seal');
  const strokes = [...document.querySelectorAll('#emblem [data-draw]')].map(el => {
    const len = el.getTotalLength ? el.getTotalLength() : 0;
    el.style.strokeDasharray  = len;
    el.style.strokeDashoffset = len;
    return { el, len };
  });

  function paintSeal() {
    const r = sealSec.getBoundingClientRect();
    const span = r.height + window.innerHeight;
    const p = clamp((window.innerHeight - r.top) / span, 0, 1);
    const q = clamp((p - 0.1) / 0.55, 0, 1);            // disegna nella salita
    strokes.forEach((s, i) => {
      const d = i / strokes.length * 0.45;
      const t = clamp((q - d) / (1 - d), 0, 1);
      s.el.style.strokeDashoffset = (s.len * (1 - t)).toFixed(1);
    });
  }

  /* ---------- preload ---------- */
  let loaded = 0;
  function bump() {
    loaded++;
    const v = Math.round(loaded / FRAME_COUNT * 100);
    barFill.style.width = v + '%';
    pct.textContent = v + '%';
    if (loaded === FRAME_COUNT) {
      resize();
      settle();
      paintSeal();
      loader.classList.add('done');
      setTimeout(() => loader.remove(), 1100);
    }
  }
  for (let i = 0; i < FRAME_COUNT; i++) {
    const img = new Image();
    img.onload = img.onerror = bump;
    img.src = src(file(i + 1));
    frames[i] = img;
  }

  addEventListener('scroll', () => {
    measure();
    if (raf === null) raf = requestAnimationFrame(loop);
    paintSeal();
  }, { passive: true });
  addEventListener('resize', () => { resize(); settle(); paintSeal(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) settle(); });
})();
</script>
</body>
</html>
